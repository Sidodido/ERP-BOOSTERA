services:
  postgres:
    image: postgres:16-alpine
    container_name: boostera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: boostera
      POSTGRES_PASSWORD: boostera_secure_2026
      POSTGRES_DB: boostera_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boostera -d boostera_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
